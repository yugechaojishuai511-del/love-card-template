
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给你的一份惊喜</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: "PingFang SC", sans-serif;
  background: linear-gradient(135deg, #ffe3ec, #ffc1d4, #fff0f5);
  color: #9b4565;
}

.card {
  width: 90%;
  max-width: 420px;
  padding: 35px 25px;
  text-align: center;
  background: rgba(255,255,255,0.82);
  border-radius: 25px;
  box-shadow: 0 15px 40px rgba(200,80,120,0.15);
  z-index: 2;
}

.heart {
  font-size: 65px;
  animation: beat 1s infinite;
}

h1 {
  margin: 20px 0;
  font-size: 28px;
}

p {
  font-size: 17px;
  line-height: 2;
  margin: 15px 0;
}

button {
  border: none;
  padding: 14px 28px;
  border-radius: 30px;
  background: #f2789d;
  color: white;
  font-size: 16px;
  margin-top: 20px;
  cursor: pointer;
}

#message {
  display: none;
  margin-top: 20px;
  color: #e05a86;
}

.float {
  position: absolute;
  bottom: -50px;
  font-size: 24px;
  animation: rise 6s linear infinite;
}

@keyframes beat {
  50% { transform: scale(1.2); }
}

@keyframes rise {
  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">
  <div class="heart">💗</div>
  <h1>生日快乐！</h1>

  <p>
    今天是属于你的特别日子。<br>
    希望你每一天都开心，<br>
    被爱包围，被温柔对待。
  </p>

  <p>愿你的未来充满惊喜 ✨</p>

  <button onclick="showMessage()">打开我的惊喜</button>

  <div id="message">
    <h2>🎁 我想对你说</h2>
    <p>
      感谢你出现在我的生命里。<br>
      愿所有美好都奔向你！<br>
      永远开心，永远幸福 💕
    </p>
  </div>
</div>

<script>
function showMessage() {
  document.getElementById("message").style.display = "block";
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "float";
  heart.innerHTML = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (4 + Math.random() * 4) + "s";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 700);
</script>

</body>
</html>

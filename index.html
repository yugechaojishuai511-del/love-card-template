
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>给你的一封情书</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#fff0f3,#fce4ec,#fff7f0);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#633b48;min-height:100vh;padding:24px}
main{max-width:680px;margin:auto;background:#ffffffd9;border-radius:24px;padding:25px;box-shadow:0 10px 40px #0001}
h1{text-align:center;color:#bd607d}
p{text-align:center;line-height:1.8}
input,textarea,button{width:100%;padding:13px;margin:9px 0;border:1px solid #e8cbd5;border-radius:12px;font-size:16px}
button{background:#d96c8d;color:white;border:0;font-weight:bold;cursor:pointer}
#photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#photos img{width:100%;border-radius:14px}
#result{word-break:break-all;margin-top:15px}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>💕 给你的一封情书 💕</h1>
<p id="intro">把心意写下来，留给最特别的人。</p>

<div id="editor">
<input id="to" placeholder="写下收信人的名字">
<input id="from" placeholder="写下你的名字">
<input id="date" type="date">
<textarea id="message" rows="6" placeholder="写下你想对TA说的话..."></textarea>
<label>选择照片（可多选）</label>
<input id="files" type="file" accept="image/*" multiple>
<button id="save" onclick="saveCard()">保存并生成分享链接 ❤️</button>
</div>

<div id="photos"></div>
<div id="letter"></div>
<div id="result"></div>
</main>

<script>
const SUPABASE_URL = "https://cseiuubvjuzostnjymub.supabase.co";
const SUPABASE_KEY = "sb_publishable_7lKtu0PjfkHA8pkzrj93VA__fBNbfLO";
const BUCKET = "love-files";

function headers(extra={}) {
  return { "apikey":SUPABASE_KEY, "Authorization":"Bearer "+SUPABASE_KEY, ...extra };
}

function render(data){
  document.getElementById("editor").classList.add("hide");
  document.getElementById("intro").textContent="❤️ 一份来自心底的礼物 ❤️";
  document.getElementById("letter").innerHTML=
    "<h2 style='text-align:center'>亲爱的 "+esc(data.to)+"</h2>"+
    "<p>"+esc(data.message).replace(/\n/g,"<br>")+"</p>"+
    "<p>—— "+esc(data.from)+"</p>"+
    (data.date ? "<p>"+esc(data.date)+"</p>" : "");
  document.getElementById("photos").innerHTML=(data.photos||[]).map(url=>
    '<img src="'+url+'" alt="爱意照片">'
  ).join("");
}

function esc(s){
  return String(s||"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;',"'":"&#39;"
  }[c]));
}

async function upload(path,file){
  const response=await fetch(SUPABASE_URL+"/storage/v1/object/"+BUCKET+"/"+path,{
    method:"POST",
    headers:headers({"Content-Type":file.type||"application/octet-stream"}),
    body:file
  });
  if(!response.ok)throw new Error("上传失败："+await response.text());
  return SUPABASE_URL+"/storage/v1/object/public/"+BUCKET+"/"+path;
}

async function saveCard(){
  const btn=document.getElementById("save");
  btn.disabled=true;
  btn.textContent="正在保存，请稍等...";
  try{
    const id=crypto.randomUUID();
    const files=document.getElementById("files").files;
    const photos=[];
    for(let i=0;i<files.length;i++){
      const ext=(files[i].name.split(".").pop()||"jpg").replace(/[^a-zA-Z0-9]/g,"");
      photos.push(await upload("cards/"+id+"/photo"+i+"."+ext,files[i]));
    }
    const data={
      to:document.getElementById("to").value,
      from:document.getElementById("from").value,
      date:document.getElementById("date").value,
      message:document.getElementById("message").value,
      photos
    };
    const manifest=new Blob([JSON.stringify(data)],{type:"application/json"});
    const response=await fetch(SUPABASE_URL+"/storage/v1/object/"+BUCKET+"/cards/"+id+"/card.json",{
      method:"POST",
      headers:headers({"Content-Type":"application/json"}),
      body:manifest
    });
    if(!response.ok)throw new Error("保存卡片失败："+await response.text());
    const link=location.origin+location.pathname+"?id="+id;
    document.getElementById("result").innerHTML=
      "<p>❤️ 卡片已保存！</p><input id='sharelink' value='"+esc(link)+"' readonly>"+
      "<button onclick='copyLink()'>复制分享链接</button>";
    render(data);
  }catch(e){
    alert("保存失败："+e.message);
    btn.disabled=false;
    btn.textContent="保存并生成分享链接 ❤️";
  }
}

async function copyLink(){
  const input=document.getElementById("sharelink");
  try{
    await navigator.clipboard.writeText(input.value);
    alert("链接已复制！");
  }catch(e){
    input.select();
    document.execCommand("copy");
    alert("链接已复制！");
  }
}

async function loadCard(){
  const id=new URLSearchParams(location.search).get("id");
  if(!id)return;
  if(!/^[a-zA-Z0-9-]+$/.test(id))return;
  document.getElementById("intro").textContent="正在打开爱的礼物...";
  try{
    const response=await fetch(SUPABASE_URL+"/storage/v1/object/public/"+BUCKET+"/cards/"+id+"/card.json");
    if(!response.ok)throw new Error("卡片不存在");
    const data=await response.json();
    render(data);
  }catch(e){
    document.getElementById("intro").textContent="暂时无法打开这份礼物。";
  }
}

loadCard();
</script>
</body>
</html>
